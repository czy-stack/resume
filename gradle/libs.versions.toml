# ---------------------------------------------------------------------------
# 版本目录（Version Catalog）
# 全仓的依赖版本、插件版本、SDK 版本唯一来源。
# 模块侧用法：libs.androidx.appcompat / libs.plugins.android.application
# SDK 版本读取：libs.versions.compileSdk.get().toInt()
# ---------------------------------------------------------------------------

[versions]
# 构建插件
agp = "7.4.1"
kotlin = "1.8.10"
protobufPlugin = "0.8.12"

# SDK 与产物
compileSdk = "32"
minSdk = "28"
targetSdk = "32"
versionCode = "1"
versionName = "1.0.0"
jvmTarget = "1.8"

# AndroidX / UI
appcompat = "1.4.0"
coreKtx = "1.7.0"
constraintlayout = "2.1.3"
material = "1.5.0"
archLifecycle = "2.4.1"
navigation = "2.4.2"
coroutines = "1.6.1"

# Compose
compose = "1.2.1"
accompanist = "0.23.0"
composeActivity = "1.4.0"
composeConstraintlayout = "1.0.0"

# 存储
room = "2.4.3"
datastore = "1.0.0"
litepal = "3.0.0"

# 网络
retrofit = "2.9.0"
retrofitAdapters = "2.8.0"
okhttp = "4.2.2"
gson = "2.9.0"
agentweb = "4.1.3"

# RxJava
rxjava = "2.2.10"
rxandroid = "2.1.1"
rxrelay = "2.1.1"

# 图片 / 工具 / 监控
glide = "4.10.0"
eventbus = "3.1.1"
leakcanary = "2.7"
hotfix = "3.2.8"

# protobuf
protobufJavalite = "3.14.0"
protoc = "3.10.0"

# 测试
junit4 = "4.13.1"
junit4Jetpack = "4.13.2"
androidxTestJunit = "1.1.3"

[libraries]
# --- AndroidX 基础 ---
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# --- 协程 ---
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# --- RxJava ---
rxjava = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxjava" }
rxandroid = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxandroid" }
rxrelay = { group = "com.jakewharton.rxrelay2", name = "rxrelay", version.ref = "rxrelay" }

# --- 网络 ---
okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
retrofit-converter-scalars = { group = "com.squareup.retrofit2", name = "converter-scalars", version.ref = "retrofit" }
retrofit-adapter-rxjava2 = { group = "com.squareup.retrofit2", name = "adapter-rxjava2", version.ref = "retrofit" }
retrofit-adapters = { group = "com.squareup.retrofit2", name = "retrofit-adapters", version.ref = "retrofitAdapters" }
agentweb = { group = "com.just.agentweb", name = "agentweb", version.ref = "agentweb" }

# --- 存储 ---
litepal = { group = "org.litepal.android", name = "kotlin", version.ref = "litepal" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-rxjava2 = { group = "androidx.room", name = "room-rxjava2", version.ref = "room" }
room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
protobuf-javalite = { group = "com.google.protobuf", name = "protobuf-javalite", version.ref = "protobufJavalite" }

# --- 图片 ---
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# --- 工具 / 监控 ---
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
hotfix = { group = "com.aliyun.ams", name = "alicloud-android-hotfix", version.ref = "hotfix" }

# --- Lifecycle ---
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "archLifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "archLifecycle" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "archLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "archLifecycle" }

# --- Compose ---
composeUi = { group = "androidx.compose.ui", name = "ui", version.ref = "compose" }
composeUiTooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose" }
composeUiToolingPreview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
composeUiTestManifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "compose" }
composeMaterial = { group = "androidx.compose.material", name = "material", version.ref = "compose" }
composeMaterialIconsExtended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose" }
composeAnimation = { group = "androidx.compose.animation", name = "animation", version.ref = "compose" }
composeActivity = { group = "androidx.activity", name = "activity-compose", version.ref = "composeActivity" }
composeConstraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "composeConstraintlayout" }
accompanist-appcompat-theme = { group = "com.google.accompanist", name = "accompanist-appcompat-theme", version.ref = "accompanist" }
accompanist-swiperefresh = { group = "com.google.accompanist", name = "accompanist-swiperefresh", version.ref = "accompanist" }

# --- Navigation ---
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# --- 测试 ---
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit4Jetpack = { group = "junit", name = "junit", version.ref = "junit4Jetpack" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# kotlin-parcelize / kotlin-kapt 随 kotlin-android 一起进 classpath，
# 在 catalog 里声明会报 "already on the classpath with an unknown version"，
# 且 alias() 不接受空版本，故模块中直接用 id("kotlin-parcelize") / id("kotlin-kapt")
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
